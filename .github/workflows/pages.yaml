name: Build and deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      rebuild_models:
        description: Rebuild all Blender assets even if cached
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Blender assets, compile and test website
        uses: docker/build-push-action@v7
        with:
          context: .
          target: pages
          platforms: linux/amd64
          push: false
          outputs: type=local,dest=exports/pages
          cache-from: type=gha,scope=pages
          cache-to: type=gha,scope=pages,mode=max
          no-cache-filters: ${{ inputs.rebuild_models && 'models' || '' }}

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: exports/pages
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
